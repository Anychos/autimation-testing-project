[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s
markers =
    regression: маркировка для регрессионных тестов
    smoke: маркировка для смоук тестов
    e2e: маркировка для e2e тестов

    ui: маркировка для UI тестов
    api: маркировка для API тестов

    auth: маркировка для тестов авторизации
    tasks: маркировка для тестов задач