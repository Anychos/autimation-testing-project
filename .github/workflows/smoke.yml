name: Смоук-тесты

on:
  push:
    branches-ignore:
      - gh-pages

concurrency:
  group: smoke-allure-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - name: Получение кода тестов
        uses: actions/checkout@v4

      - name: Получение кода приложения
        id: application
        uses: actions/checkout@v4
        with:
          repository: Anychos/autimation-testing-project-app
          path: application

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Установка зависимостей тестов
        run: python -m pip install -r requirements.txt

      - name: Запуск приложения
        working-directory: application
        run: |
          cp .env.example .env
          docker compose -p smoke-ci up -d --build --wait --wait-timeout 120 backend

      - name: Запуск тестов
        id: tests
        env:
          HTTP_CLIENT.BASE_URL: http://localhost:8000
          HTTP_CLIENT.TIMEOUT: '10'
        run: python -m pytest tests/api

      - name: Проверка наличия результатов Allure
        id: results
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          if find allure-results -maxdepth 1 -name '*-result.json' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Проверка наличия истории отчётов
        if: always() && steps.results.outputs.available == 'true'
        id: history_branch
        run: |
          git ls-remote --exit-code --heads origin gh-pages > /dev/null && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Получение истории отчётов
        if: always() && steps.history_branch.outcome == 'success' && steps.history_branch.outputs.exists == 'true'
        id: checkout_history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Удаление метаданных Git из истории отчётов
        if: always() && steps.checkout_history.outcome == 'success'
        id: clean_history
        run: rm -rf gh-pages/.git

      - name: Формирование отчёта Allure
        if: always() && steps.history_branch.outcome == 'success' && (steps.history_branch.outputs.exists != 'true' || steps.clean_history.outcome == 'success')
        id: report
        env:
          REPORT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.42.0/allure-commandline-2.42.0.tgz | tar -xz -C "$RUNNER_TEMP"
          mkdir -p allure-history
          if [ -d gh-pages ]; then
            cp -a gh-pages/. allure-history/
          fi
          if [ -d gh-pages/last-history ]; then
            cp -a gh-pages/last-history allure-results/history
          fi
          python -c 'import json, os; e = os.environ; base = e["REPORT_BASE_URL"].rstrip("/"); json.dump({"name": "GitHub Actions", "type": "github", "reportName": "Tests", "buildOrder": int(e["GITHUB_RUN_NUMBER"]), "buildName": "Run #" + e["GITHUB_RUN_NUMBER"], "buildUrl": e["GITHUB_SERVER_URL"] + "/" + e["GITHUB_REPOSITORY"] + "/actions/runs/" + e["GITHUB_RUN_ID"], "reportUrl": base + "/" + e["GITHUB_RUN_NUMBER"] + "/"}, open("allure-results/executor.json", "w", encoding="utf-8"))'
          "$RUNNER_TEMP/allure-2.42.0/bin/allure" generate allure-results --clean -o allure-report
          rm -rf "allure-history/$GITHUB_RUN_NUMBER" allure-history/last-history
          cp -a allure-report "allure-history/$GITHUB_RUN_NUMBER"
          cp -a allure-report/history allure-history/last-history
          find allure-history -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^[0-9]+$' | sort -rn | tail -n +6 | while read -r old_report; do
            rm -rf "allure-history/$old_report"
          done

      - name: Назначение последнего отчёта главной страницей
        if: always() && steps.report.outcome == 'success'
        id: homepage
        run: |
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s/">\n<a href="%s/">Latest Allure report</a>\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > allure-history/index.html

      - name: Сохранение истории отчётов
        if: always() && steps.homepage.outcome == 'success'
        id: history
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true

      - name: Загрузка артефакта Pages
        if: always() && steps.history.outcome == 'success'
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-history

      - name: Публикация отчёта в GitHub Pages
        if: always() && steps.upload.outcome == 'success'
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Ожидание перед повторной публикацией
        if: always() && steps.deploy.outcome == 'failure'
        run: sleep 15

      - name: Повторная публикация отчёта
        if: always() && steps.deploy.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v4

      - name: Добавление ссылки на отчёт в сводку
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success')
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
        run: |
          echo "[Allure report #${GITHUB_RUN_NUMBER}](${PAGE_URL}${GITHUB_RUN_NUMBER}/)" >> "$GITHUB_STEP_SUMMARY"

      - name: Просмотр логов приложения при ошибке
        if: failure() && steps.application.outcome == 'success'
        working-directory: application
        run: docker compose -p smoke-ci logs --no-color

      - name: Остановка приложения
        if: always() && steps.application.outcome == 'success'
        working-directory: application
        run: docker compose -p smoke-ci down --volumes
